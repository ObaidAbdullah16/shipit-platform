# Run the whole app on your laptop:  docker compose up --build
# then open http://localhost:8080   (stop: docker compose down -v)
name: shipit

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shipit
      POSTGRES_PASSWORD: shipit-local-only
      POSTGRES_DB: shipit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipit"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: services/api
      args:
        VERSION: local
    environment:
      DATABASE_URL: postgres://shipit:shipit-local-only@postgres:5432/shipit?sslmode=disable
      REDIS_ADDR: redis:6379
      CREATE_PER_MINUTE: "100"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: services/worker
    environment:
      DATABASE_URL: postgresql://shipit:shipit-local-only@postgres:5432/shipit
      REDIS_ADDR: redis:6379
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  pgdata:
