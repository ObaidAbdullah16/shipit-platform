# Continuous delivery: every change to main that touches the services is tested
# (the full CI workflow), built for arm64, scanned, signed with cosign, pushed to
# ECR by digest and - if ShipIt is currently running - rolled out with automatic
# rollback. When ShipIt is stopped, the release is recorded and used by the next `up`.
#
# AWS accounts that GitHub cannot log in to (new AWS sign-up "projects", AWS_ROLE_ARN not set):
# the same build, scan, SBOM and keyless signature, but pushed to GitHub's container registry
# (ghcr.io/<owner>/shipit-api|worker, tag "main" = newest). On the laptop,
# `bash scripts/release-pull.sh` copies it into ECR (signature included) and rolls it out.
name: Release
on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - ".github/workflows/release.yml"
      - ".github/actions/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: shipit-release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  prepare:
    name: Container registry
    needs: ci
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: aws
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "<1.18.0"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
          role-session-name: shipit-release-prepare
      - name: Ensure ECR repositories exist
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
        run: bash scripts/bootstrap.sh
      - id: v
        run: echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-api:
    name: Build api (arm64)
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    environment: aws
    permissions:
      contents: read
      id-token: write   # AWS role + keyless cosign signature
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
          role-session-name: shipit-release-api
      - id: build
        uses: ./.github/actions/build-sign-push
        with:
          service: api
          version: ${{ needs.prepare.outputs.version }}

  build-worker:
    name: Build worker (arm64)
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    environment: aws
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
          role-session-name: shipit-release-worker
      - id: build
        uses: ./.github/actions/build-sign-push
        with:
          service: worker
          version: ${{ needs.prepare.outputs.version }}

  deploy:
    name: Record and deploy
    needs: [prepare, build-api, build-worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: aws
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "<1.18.0"
          terraform_wrapper: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
          role-session-name: shipit-release-deploy
      - name: Record release and deploy if ShipIt is running
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
          API_IMAGE: ${{ needs.build-api.outputs.image }}
          WORKER_IMAGE: ${{ needs.build-worker.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          source scripts/lib.sh
          verify_signature "$API_IMAGE"
          verify_signature "$WORKER_IMAGE"
          put_release "$SSM_LATEST" "$API_IMAGE" "$WORKER_IMAGE" "$VERSION"
          echo "Release $VERSION recorded." >> "$GITHUB_STEP_SUMMARY"
          if app_is_up; then
            bash scripts/deploy.sh "$API_IMAGE" "$WORKER_IMAGE" "$VERSION"
            echo "Deployed to $(tf_out "$TF_APP" url)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ShipIt is stopped - the next \`up\` will start this release." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---- AWS accounts GitHub cannot log in to: build to ghcr.io instead -------------
  build-api-ghcr:
    name: Build api (arm64, ghcr.io)
    needs: ci
    if: vars.AWS_ROLE_ARN == ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # keyless cosign signature
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: v
        run: echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: ./.github/actions/build-sign-push
        with:
          service: api
          version: ${{ steps.v.outputs.version }}
          registry: ghcr

  build-worker-ghcr:
    name: Build worker (arm64, ghcr.io)
    needs: ci
    if: vars.AWS_ROLE_ARN == ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: v
        run: echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: ./.github/actions/build-sign-push
        with:
          service: worker
          version: ${{ steps.v.outputs.version }}
          registry: ghcr

  ghcr-next-step:
    name: Next step (on your laptop)
    needs: [build-api-ghcr, build-worker-ghcr]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Summary
        env:
          API_IMAGE: ${{ needs.build-api-ghcr.outputs.image }}
          WORKER_IMAGE: ${{ needs.build-worker-ghcr.outputs.image }}
        run: |
          {
            echo "### Signed release ready on ghcr.io"
            echo "- api: \`$API_IMAGE\`"
            echo "- worker: \`$WORKER_IMAGE\`"
            echo
            echo "Deploy it from your laptop: \`bash scripts/release-pull.sh\` (or \`bash scripts/up.sh\` if ShipIt is stopped)."
          } >> "$GITHUB_STEP_SUMMARY"
