version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /services/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /services/worker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directories: ["/services/api", "/services/worker"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: terraform
    directories: ["/infra/app", "/infra/bootstrap"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /.github   # requirements-ci.txt: the pinned CI tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      ci-tools:
        patterns: ["*"]
