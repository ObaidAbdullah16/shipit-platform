# Checks skipped on purpose. ShipIt is a demo that runs for an hour or two at a
# time on a $10/month budget; each skip is a conscious cost/benefit decision and
# appears in docs/SECURITY.md under "what I would add for a real client".
skip-check:
  - CKV_AWS_136   # ECR KMS CMK: AES256 is enough; a customer key costs $1/month
  - CKV_AWS_91    # ALB access logs: needs a log bucket that outlives `down`
  - CKV_AWS_65    # Container Insights: extra CloudWatch cost; ALB/RDS metrics cover the demo
  - CKV_AWS_394   # AZ pinning: the stack picks the first two AZs on purpose
  - CKV_AWS_378   # HTTP target group: TLS ends at the ALB; traffic to tasks stays inside the VPC
  - CKV_AWS_353   # RDS Performance Insights: extra cost for a short-lived instance
  - CKV_AWS_338   # 1-year log retention: 7 days keeps CloudWatch cost near zero
  - CKV_AWS_333   # Public IP on tasks: replaces a $33/month NAT gateway; SG allows only the ALB
  - CKV_AWS_293   # RDS deletion protection: `down` must delete it
  - CKV_AWS_260   # Port 80 from the internet: public demo; redirects to HTTPS when a domain is set
  - CKV_AWS_158   # Log group KMS CMK: default encryption is enough for demo logs
  - CKV_AWS_157   # Multi-AZ RDS: doubles the database cost
  - CKV_AWS_150   # ALB deletion protection: `down` must delete it
  - CKV_AWS_129   # RDS log exports: extra log groups that would outlive `down`
  - CKV_AWS_118   # RDS enhanced monitoring: extra role and cost
  - CKV_AWS_103   # TLS on the HTTP listener: HTTPS listener (TLS 1.3 policy) is created when a domain is set
  - CKV2_AWS_30   # Postgres query logging: same as CKV_AWS_129
  - CKV2_AWS_28   # WAF on the ALB: ~$6/month minimum; app-level rate limiting is in the API
  - CKV2_AWS_20   # HTTP->HTTPS redirect: enabled automatically when a domain is set
  - CKV2_AWS_11   # VPC flow logs: cost; nothing else runs in this VPC
